name: offline-checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0.403
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 'true'
      DOTNET_PROCESSOR_COUNT: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Explicit restore with cleared package sources
        run: bash scripts/prepare.sh
      - name: Build and adversarial tests without restore
        run: bash scripts/test.sh
      - name: Actual loopback demo without restore
        run: bash scripts/demo.sh --json
